</head>
<body>

<div class="stage">
  <div class="phone">

    <div class="phone__screen">
      <span class="phone__notch" aria-hidden="true"></span>
      <span class="phone__home" aria-hidden="true"></span>

      <div class="scroll" id="scroller">
        <main class="screen d is-active" id="screen-c92" aria-label="남은 식빵의 반전 매력 상세 화면" tabindex="-1">
          <header class="appbar" data-appbar>
            <div class="navbar d-nav">
              <button type="button" class="d-navbtn" aria-label="시리즈 목록으로 돌아가기" data-href="index.html"><img alt="" data-a="s2_arrow_d"></button>
              <button type="button" class="d-navbtn" aria-label="공유하기"><img alt="" data-a="s2_share_d"></button>
            </div>
          </header>

          <div class="kt-hero" style="background:#cdb08d" data-hero><img alt="남은 식빵의 반전 매력" data-a="e92_hero"></div>

          <div class="d-intro kt-intro">
            <span class="badge"><span class="badge__star"><img alt="" data-a="s2_star1"></span>시리즈</span>

            <p class="d-sub">에그타르트부터 브레드 푸딩까지</p>
          </div>

          <div class="kt-panels" id="c-panels"></div>

          <p class="d-date kt-date">작성일 2026년 5월</p>
          <img class="pb-logo" alt="신한 SOL Pay 디스커버" data-a="solpay">
          <div class="d-band"></div>

          <div class="d-series">
            <span class="badge"><span class="badge__star"><img alt="" data-a="s2_star1"></span>시리즈</span>

            <p class="d-series__desc">간단하지만 특별한, 일상 속에서 즐길 수 있는 센스 있는 레시피를 알려드려요.</p>

            <ul class="d-eplist__items" id="c-items"></ul>
            <div class="d-expandwrap"><button type="button" class="d-expand" id="c-expand" aria-expanded="false"><span class="d-plus" aria-hidden="true"></span>펼쳐보기</button></div>
          </section>

          <div class="d-toolbar">
            <button type="button" class="d-tool" aria-label="좋아요"><img alt="" data-a="s2_heart_d"></button>
            <button type="button" class="d-tool" aria-label="저장하기"><img alt="" data-a="s2_bookmark_d"></button>
          </div>
        </main>

      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <div class="sheet-scrim" id="sheet-scrim" hidden></div>
      <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>

          <h2 class="sheet__title" id="sheet-title">공유하기</h2>
          <button type="button" class="sheet__x" id="sheet-close" aria-label="공유하기 닫기"></button>
        </div>
        <ul class="sheet__list">
          <li><button type="button" class="sheet__item" data-share="카카오톡">
            <span class="sheet__ico"><span class="glyph--kakao" aria-hidden="true">TALK</span></span>카카오톡</button></li>
          <li><button type="button" class="sheet__item" data-share="페이스북">
            <span class="sheet__ico"><span class="glyph--fb" aria-hidden="true">f</span></span>페이스북</button></li>
          <li><button type="button" class="sheet__item" data-share="X">
            <span class="sheet__ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="#101828" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></span>X</button></li>
          <li><button type="button" class="sheet__item" data-share="링크">
            <span class="sheet__ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#101828" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10.1 13.9a5 5 0 0 0 7.5.5l2.7-2.7a5 5 0 0 0-7-7l-1.6 1.5"/><path d="M13.9 10.1a5 5 0 0 0-7.5-.5l-2.7 2.7a5 5 0 0 0 7 7l1.5-1.5"/></svg></span>링크 복사</button></li>
        </ul>
      </aside>
    </div>
  </div>

</div>

<script src="assets/img/map.js"></script>
<script src="app.js"></script>
<script>

document.getElementById('c-panels').innerHTML = Array.from({length: 15}, (_, i) => {
  const k = 'e92_p' + (i + 1);
  return `<img src="${A[k]}" ${ar(k)} loading="lazy" decoding="async" alt="남은 식빵의 반전 매력 ${i + 1}컷">`;
}).join('');

const C = [{"no": 94, "t": "도시락에도 봄이 왔나 봄", "cur": false, "go": ""}, {"no": 93, "t": "그릇까지 냠냠", "cur": false, "go": ""}, {"no": 92, "t": "남은 식빵의 반전 매력", "cur": true, "go": "ep92.html"}, {"no": 91, "t": "한입에 즐기는 스페인의 맛", "cur": false, "go": "ep91.html"}, {"no": 90, "t": "포르투갈 문어밥 아로스 드 폴부", "cur": false, "go": ""}];
document.getElementById('c-items').innerHTML = C.map(e => `
<li><button type="button" class="d-eprow"${e.cur ? ' aria-current="true"' : ''}${e.go && !e.cur ? ` data-href="${e.go}"` : ''} aria-label="${e.no}화 ${esc(e.t)}${e.cur ? ' (현재 보는 화)' : ''}">
  <span class="d-eprow__no">${e.no}</span>
  <span class="d-eprow__t">${esc(e.t)}</span>
  <img loading="lazy" decoding="async" src="${A['t' + e.no]}" alt="">
</button></li>`).join('');

document.getElementById('c-expand').addEventListener('click', ev => {
  const on = ev.currentTarget.getAttribute('aria-expanded') === 'true';
  ev.currentTarget.setAttribute('aria-expanded', String(!on));
  ev.currentTarget.lastChild.textContent = on ? '펼쳐보기' : '접기';
  ev.currentTarget.querySelector('.d-plus').classList.toggle('is-minus', !on);
});

relayout();
</script>
</body>
</html>
