<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>19화 분식 못 잃어! 다이어터를 위한 레시피 — [Tasty SOLution]</title>
<meta name="description" content="신한 SOL pay [Tasty SOLution] 콘텐츠 프로토타입">
<link rel="preload" href="assets/fonts/p700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">
  <div class="phone">
    <span class="phone__btn phone__btn--silent" aria-hidden="true"></span>
    <span class="phone__btn phone__btn--volup" aria-hidden="true"></span>
    <span class="phone__btn phone__btn--voldown" aria-hidden="true"></span>
    <span class="phone__btn phone__btn--power" aria-hidden="true"></span>

    <div class="phone__screen">
      <span class="phone__notch" aria-hidden="true"></span>
      <span class="phone__home" aria-hidden="true"></span>

      <div class="scroll" id="scroller">
        <!-- ============ SCREEN 4 : 분식 못 잃어! 다이어터를 위한 레시피 ============ -->
        <main class="screen d is-active" id="screen-kito" aria-label="분식 못 잃어! 다이어터를 위한 레시피 상세 화면" tabindex="-1">
          <header class="appbar" data-appbar>
            <div class="navbar d-nav">
              <button type="button" class="d-navbtn" aria-label="시리즈 목록으로 돌아가기" data-href="index.html"><img alt="" data-a="s2_arrow_d"></button>
              <button type="button" class="d-navbtn" aria-label="공유하기"><img alt="" data-a="s2_share_d"></button>
            </div>
          </header>

          <div class="kt-hero" data-hero><img alt="키토 분식을 먹는 오운완 씨" data-a="k_hero"></div>

          <div class="d-intro kt-intro">
            <span class="badge"><span class="badge__star"><img alt="" data-a="s2_star1"></span>시리즈</span>
            <h1 class="d-title">분식 못 잃어!<br>다이어터를 위한 레시피</h1>
            <p class="d-sub">키토떡볶이&amp;키토김밥</p>
          </div>

          <div class="kt-panels" id="kt-panels"></div>

          <p class="d-date kt-date">작성일 2024년 4월</p>
          <div class="d-band"></div>

          <div class="d-series">
            <span class="badge"><span class="badge__star"><img alt="" data-a="s2_star1"></span>시리즈</span>
            <p class="d-series__title">[Tasty SOLution]</p>
            <p class="d-series__desc">간단하지만 특별한, 일상 속에서 즐길 수 있는 센스 있는 레시피를 알려드려요.</p>
          </div>

          <section class="d-eplist" aria-labelledby="kt-count">
            <div class="d-eplist__head">
              <p class="d-eplist__count" id="kt-count">총 106화</p>
              <button type="button" class="d-eplist__all" data-href="index.html">전체보기<span class="d-chev" aria-hidden="true"></span></button>
            </div>
            <div class="d-rule"></div>
            <ul class="d-eplist__items" id="kt-items"></ul>
            <div class="d-expandwrap"><button type="button" class="d-expand" id="kt-expand" aria-expanded="false"><span class="d-plus" aria-hidden="true"></span>펼쳐보기</button></div>
          </section>

          <div class="d-toolbar">
            <button type="button" class="d-tool" aria-label="좋아요"><img alt="" data-a="s2_heart_d"></button>
            <button type="button" class="d-tool" aria-label="저장하기"><img alt="" data-a="s2_bookmark_d"></button>
          </div>
        </main>


      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <div class="sheet-scrim" id="sheet-scrim" hidden></div>
      <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
        <div class="sheet__head">
          <h2 class="sheet__title" id="sheet-title">공유하기</h2>
          <button type="button" class="sheet__x" id="sheet-close" aria-label="공유하기 닫기"></button>
        </div>
        <ul class="sheet__list">
          <li><button type="button" class="sheet__item" data-share="카카오톡">
            <span class="sheet__ico"><span class="glyph--kakao" aria-hidden="true">TALK</span></span>카카오톡</button></li>
          <li><button type="button" class="sheet__item" data-share="페이스북">
            <span class="sheet__ico"><span class="glyph--fb" aria-hidden="true">f</span></span>페이스북</button></li>
          <li><button type="button" class="sheet__item" data-share="X">
            <span class="sheet__ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="#101828" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></span>X</button></li>
          <li><button type="button" class="sheet__item" data-share="링크">
            <span class="sheet__ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#101828" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10.1 13.9a5 5 0 0 0 7.5.5l2.7-2.7a5 5 0 0 0-7-7l-1.6 1.5"/><path d="M13.9 10.1a5 5 0 0 0-7.5-.5l-2.7 2.7a5 5 0 0 0 7 7l1.5-1.5"/></svg></span>링크 복사</button></li>
        </ul>
      </aside>
    </div>
  </div>

</div>

<script src="assets/img/map.js"></script>
<script src="app.js"></script>
<script>
/* ---------- 키토 분식 편 패널 · 회차 목록 ---------- */
const KT_ALT = [
  '어느덧 헬스 4개월 차, 오운완 씨',
  '헬스를 마치고 집에 가는 길에 만난 분식 포장마차',
  '기껏 운동 해놓고 떡튀순에 무너질 순 없어!',
  '회원님, 요즘 유행하는 키토 분식 아세요?',
  '키토 떡볶이와 김밥… 도전!!',
  '키토 고추장 재료',
  '키토 고추장 레시피 1·2·3',
  '키토 떡볶이 재료',
  '팬에 아보카도 오일을 두르고 고추장을 볶는다',
  '키토 떡과 양파, 파, 어묵을 넣고 볶는다',
  '물을 붓고 강불에 볶는다',
  '깨와 삶은 달걀을 곁들이면 키토 떡볶이 완성',
  '키토 김밥 재료',
  '계란물을 부어 지단을 부친다',
  '당근과 오이를 채 썰어 볶는다',
  '지단을 돌돌 말아 채를 썬 후 김 위에 올린다',
  '먹기 좋은 크기로 썰면 키토 김밥 완성',
  '운동하면서 죄책감 없이 먹을 수 있는 키토 분식'
];
document.getElementById('kt-panels').innerHTML = KT_ALT
  .map((alt, i) => `<img loading="lazy" decoding="async" ${ar('k_p' + (i + 1))} src="${A['k_p' + (i + 1)]}" alt="${esc(alt)}">`).join('');

const KT = [
  {no:21, t:'꽃게가 활짝 피었습니다'},
  {no:20, t:'집에서 즐기는 만찬!'},
  {no:19, t:'분식 못 잃어! 다이어터를 위한 레시피', cur:true},
  {no:18, t:'내돈내만 이유식!'},
  {no:17, t:'보약 대신 챙기는 봄 주꾸미'}
];
document.getElementById('kt-items').innerHTML = KT.map(e => `
<li><button type="button" class="d-eprow"${e.cur ? ' aria-current="true"' : ''} aria-label="${e.no}화 ${esc(e.t)}${e.cur ? ' (현재 보는 화)' : ''}">
  <span class="d-eprow__no">${e.no}</span>
  <span class="d-eprow__t">${esc(e.t)}</span>
  <img loading="lazy" decoding="async" ${ar('t' + e.no)} src="${A['t' + e.no]}" alt="">
</button></li>`).join('');

document.getElementById('kt-expand').addEventListener('click', ev => {
  const on = ev.currentTarget.getAttribute('aria-expanded') === 'true';
  ev.currentTarget.setAttribute('aria-expanded', String(!on));
  ev.currentTarget.lastChild.textContent = on ? '펼쳐보기' : '접기';
  ev.currentTarget.querySelector('.d-plus').classList.toggle('is-minus', !on);
});


relayout();
</script>
</body>
</html>
