<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>61화 잼보다 더 향긋한 시나몬 사과 콩포트 — [Tasty SOLution]</title>
<meta name="description" content="신한 SOL pay [Tasty SOLution] 콘텐츠 프로토타입">
<link rel="preload" href="assets/fonts/p700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">
  <div class="phone">
    <span class="phone__btn phone__btn--silent" aria-hidden="true"></span>
    <span class="phone__btn phone__btn--volup" aria-hidden="true"></span>
    <span class="phone__btn phone__btn--voldown" aria-hidden="true"></span>
    <span class="phone__btn phone__btn--power" aria-hidden="true"></span>

    <div class="phone__screen">
      <span class="phone__notch" aria-hidden="true"></span>
      <span class="phone__home" aria-hidden="true"></span>

      <div class="scroll" id="scroller">
        <!-- ============ SCREEN 7 : 잼보다 더 향긋한 시나몬 사과 콩포트 ============ -->
        <main class="screen d is-active" id="screen-comp" aria-label="잼보다 더 향긋한 시나몬 사과 콩포트 상세 화면" tabindex="-1">
          <header class="appbar" data-appbar>
            <div class="statusbar d-status">
              <span class="statusbar__time">12:12</span>
              <span class="statusbar__icons">
                <img class="ico-signal" alt="" data-a="s2_signal_d">
                <img class="ico-wifi" alt="" data-a="s2_wifi_d">
                <img class="ico-battery" alt="" data-a="s2_battery_d">
              </span>
            </div>
            <div class="navbar d-nav">
              <button type="button" class="d-navbtn" aria-label="시리즈 목록으로 돌아가기" data-href="index.html"><img alt="" data-a="s2_arrow_d"></button>
              <button type="button" class="d-navbtn" aria-label="공유하기"><img alt="" data-a="s2_share_d"></button>
            </div>
          </header>

          <div class="kt-hero kt-hero--comp" data-hero><img alt="시나몬 사과 콩포트를 든 백설" data-a="c_hero"></div>

          <div class="d-intro kt-intro">
            <span class="badge"><span class="badge__star"><img alt="" data-a="s2_star1"></span>시리즈</span>
            <h1 class="d-title">잼보다 더 향긋한<br>시나몬 사과 콩포트</h1>
            <p class="d-sub">프랑스 후식 콩포트로<br>겨울향 나는 브런치 완성!</p>
          </div>

          <div class="kt-panels cp-panels" id="cp-panels"></div>

          <p class="d-date cp-date">작성일 2025년 12월</p>
          <div class="d-band"></div>

          <div class="d-series">
            <span class="badge"><span class="badge__star"><img alt="" data-a="s2_star1"></span>시리즈</span>
            <p class="d-series__title">[Tasty SOLution]</p>
            <p class="d-series__desc">간단하지만 특별한, 일상 속에서 즐길 수 있는 센스 있는 레시피를 알려드려요.</p>
          </div>

          <section class="d-eplist" aria-labelledby="cp-count">
            <div class="d-eplist__head">
              <p class="d-eplist__count" id="cp-count">총 106화</p>
              <button type="button" class="d-eplist__all" data-href="index.html">전체보기<span class="d-chev" aria-hidden="true"></span></button>
            </div>
            <div class="d-rule"></div>
            <ul class="d-eplist__items" id="cp-items"></ul>
            <div class="d-expandwrap"><button type="button" class="d-expand" id="cp-expand" aria-expanded="false"><span class="d-plus" aria-hidden="true"></span>펼쳐보기</button></div>
          </section>

          <div class="d-toolbar">
            <button type="button" class="d-tool" aria-label="좋아요"><img alt="" data-a="s2_heart_d"></button>
            <button type="button" class="d-tool" aria-label="저장하기"><img alt="" data-a="s2_bookmark_d"></button>
          </div>
        </main>


      </div>
    </div>
  </div>

</div>

<script src="assets/img/map.js"></script>
<script src="app.js"></script>
<script>
/* ---------- 시나몬 사과 콩포트 편 패널 · 회차 목록 ---------- */
const CP_ALT = [
  '백설의 홈 파티에 초대받은 친구들',
  '어머, 둘 다 빨리 왔네! 나 좀 도와줄래?',
  '냉장고에서 콩포트 좀 꺼내줄래?',
  '그게 바로 콩포트야! 잼과 비슷하지만 다른 요리',
  '백설아, 이 콩포트도 직접 만든 거야?',
  '시나몬 사과 콩포트 재료',
  '사과를 4등분 하고, 씨를 제거한 후 얇게 썬다',
  '냄비에 사과와 물, 설탕을 넣고 끓인다',
  '내용물이 끓으면 레몬즙을 추가한다',
  '시나몬 파우더를 뿌리고 중불에 30분 졸이면 완성!',
  '빵이랑 먹어도 맛있겠다~ 크루아상이랑 같이 먹어볼래?',
  '콩포트 활용법 — 햄 치즈 크루아상 재료',
  '크루아상을 반으로 잘라 살짝 굽는다',
  '홀그레인 머스터드, 발사믹 식초, 올리브유를 섞어 스프레드를 만든다',
  '크루아상에 스프레드를 바르고 슬라이스 치즈, 햄, 콩포트, 루꼴라를 넣으면 완성!',
  '요거트, 아이스크림 등과 곁들여 먹어도 Good!',
  '잼도 좋지만 콩포트도 매력적이지?'
];
document.getElementById('cp-panels').innerHTML = CP_ALT
  .map((alt, i) => `<img loading="lazy" decoding="async" ${ar('c_p' + (i + 1))} src="${A['c_p' + (i + 1)]}" alt="${esc(alt)}">`).join('');

const CP = [
  {no:63, t:'팥 들었슈!'},
  {no:62, t:'까먹기만 하기엔 아까워! 귤 활용 디저트 레시피'},
  {no:61, t:'잼보다 더 향긋한 시나몬 사과 콩포트', cur:true},
  {no:60, t:'자연이 포개 놓은 감칠맛'},
  {no:59, t:'달콤한 늦가을 맛! 시나몬롤 만들기'}
];
document.getElementById('cp-items').innerHTML = CP.map(e => `
<li><button type="button" class="d-eprow"${e.cur ? ' aria-current="true"' : ''} aria-label="${e.no}화 ${esc(e.t)}${e.cur ? ' (현재 보는 화)' : ''}">
  <span class="d-eprow__no">${e.no}</span>
  <span class="d-eprow__t">${esc(e.t)}</span>
  <img loading="lazy" decoding="async" ${ar('t' + e.no)} src="${A['t' + e.no]}" alt="">
</button></li>`).join('');

document.getElementById('cp-expand').addEventListener('click', ev => {
  const on = ev.currentTarget.getAttribute('aria-expanded') === 'true';
  ev.currentTarget.setAttribute('aria-expanded', String(!on));
  ev.currentTarget.lastChild.textContent = on ? '펼쳐보기' : '접기';
  ev.currentTarget.querySelector('.d-plus').classList.toggle('is-minus', !on);
});

relayout();
</script>
</body>
</html>
